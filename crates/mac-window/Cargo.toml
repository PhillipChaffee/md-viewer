[package]
name = "mac-window"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "What md-viewer asks of AppKit about its window: where the window buttons sit, and who answers the quit key"
license = "MIT"
repository = "https://github.com/PhillipChaffee/md-viewer"
readme = "README.md"
keywords = ["macos", "appkit", "window", "titlebar"]
categories = ["gui", "os::macos-apis"]
publish = false

[dependencies]
raw-window-handle = "0.6"

# The versions the window stack already resolves to on a Mac (arboard, rfd
# and glutin ask for them), so this crate adds none to the lockfile.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSEnumerator",
    "NSGeometry",
    "NSString",
] }

# The workspace's lint table (the root Cargo.toml gives each entry its
# reason), copied because a crate inherits that table whole or not at all,
# and this crate differs from it in one entry.
[lints.rust]
# The one difference. The workspace forbids unsafe code; this crate exists
# to hold the single unsafe function the window needs on a Mac, behind an
# `#[expect(unsafe_code, reason)]`. Anything else unsafe here is an error.
# GATES.md records the exception.
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"

[lints.rustdoc]
all = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
multiple_crate_versions = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
doc_paragraphs_missing_punctuation = "warn"
# Stricter than the workspace, which has no unsafe block to comment: each
# one here says why it is sound.
undocumented_unsafe_blocks = "deny"
