[package]
name = "md-viewer"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "Fast, lightweight markdown viewer for Linux with tabs, file explorer, and live reload"
license = "MIT"
repository = "https://github.com/PhillipChaffee/md-viewer"
homepage = "https://github.com/PhillipChaffee/md-viewer"
documentation = "https://github.com/PhillipChaffee/md-viewer#readme"
readme = "README.md"
keywords = ["markdown", "viewer", "egui", "linux", "desktop"]
categories = ["command-line-utilities", "gui", "visualization"]
exclude = [
    "screenshots/*",
    ".claude/*",
    "vendor/*",
]

[dependencies]
# Core GUI framework - eframe re-exports egui
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
    "persistence",
    "accesskit",
] }
egui = { version = "0.33", features = ["accesskit"] }

# Markdown rendering with syntax highlighting (fork with typography support)
egui_commonmark_extended = { version = "0.28.3", features = [
    "better_syntax_highlighting",
    "svg",
    "svg_text",
    "load-images",
    "animated-images",
    "fetch",
    "mermaid",
    "math",
] }

# Image format support
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

# The window's buttons and the quit key on a Mac; does nothing elsewhere
mac-window = { path = "crates/mac-window", version = "0.1.0" }

# File operations
rfd = "0.17"
notify = "6.1"
notify-debouncer-mini = "0.4"
clap = { version = "4", features = ["derive"] }

# Performance
mimalloc = "0.1"

# Serialization for persistence
serde = { version = "1", features = ["derive"] }
# The format of eframe's settings file, at the version eframe writes it
# with. The file is read once before the window exists, for the app icon.
ron = "0.11"

# Logging
env_logger = "0.11"
log = "0.4"
regex = "1.12.2"
pulldown-cmark = { version = "0.13", default-features = false }
fontique = { version = "0.12.0", features = ["fontconfig-dlopen"] }
sys-locale = "0.3.2"
ttf-parser = "0.25"
url = "2.5"
percent-encoding = "2.3"

# cargo-shear cannot see a crate that is used only for its features: `image`
# is never imported, but its png/jpeg/gif features switch on the decoders
# egui_extras needs to show images in documents. The renderer's
# `animated-images` feature asks for the GIF and WebP decoders itself.
[package.metadata.cargo-shear]
ignored = ["image"]

[features]
default = []

[workspace]
# `crates/mac-window` holds the AppKit calls the window needs on a Mac,
# two of them unsafe: this crate forbids unsafe code, so they cannot
# live here. It is gated with this crate; GATES.md says where it differs.
members = ["crates/mac-window"]
# The vendored forks keep their own manifests and are not gated here: they
# are upstream code this repository patches in, reviewed against upstream.
exclude = ["vendor"]

# >>> full-lint managed (./gates sync rewrites this block; add a line with "# exception: <reason>" to extend it)
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }  # exception: `kani` is set only by `cargo kani`, which compiles the proof harnesses in each module's proofs.rs (PROOFS.md)

[workspace.lints.rustdoc]
all = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
doc_paragraphs_missing_punctuation = "warn"
redundant_pub_crate = "allow"  # exception: nursery's redundant_pub_crate contradicts rustc's unreachable_pub; the rustc lint wins, `pub(crate)` states the real reach
multiple_crate_versions = "allow"  # exception: the eframe, typst and merman stacks pin generations of shared crates this manifest does not choose; deny.toml's bans list owns the duplicates
# <<< full-lint managed

[lints]
workspace = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-dev]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 4

[patch.crates-io]
epaint = { path = "vendor/epaint", version = "0.33.3" }
egui_commonmark_extended = { path = "vendor/egui_commonmark/egui_commonmark", version = "0.28.3" }
egui_commonmark_backend_extended = { path = "vendor/egui_commonmark/egui_commonmark_backend", version = "0.28.3" }

[dev-dependencies]
egui_kittest = { version = "0.33.3", default-features = false, features = ["eframe"] }
