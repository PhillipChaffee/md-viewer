<script>
/* GitHub Pages serves this file for a missing page at any depth, where a
   relative link would point into the missing folder. This anchors the links
   below to the site's root: the first folder on github.io, else "/". Without
   JavaScript they are right for a miss one level down, and the styles are
   inline so the page reads the same at any depth. */
(function () {
  var base = document.createElement("base");
  base.href = /\.github\.io$/.test(location.hostname) ? "/" + location.pathname.split("/")[1] + "/" : "/";
  document.head.appendChild(base);
})();
</script>
