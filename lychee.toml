# Link-check configuration. Retry then fail: a timeout must not pass
# silently. Exclusions carry reasons: vendor/ holds upstream READMEs whose
# relative links resolve only in the upstream repository layout, and target/
# is build output. The Source Serif and Source Code Pro licenses are legal
# text kept verbatim; their one URL (adobe.com) answers 403 to automated
# clients.
max_retries = 2
timeout = 20
exclude_path = [
    "./vendor",
    "./target",
    "./assets/fonts/SourceSerif4-LICENSE.txt",
    "./assets/fonts/SourceCodePro-LICENSE.txt",
]
