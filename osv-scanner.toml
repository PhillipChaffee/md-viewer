# osv-scanner's allow-list takes bare SPDX identifiers only, so a license
# with an exception clause cannot be listed. ar_archive_writer is
# "Apache-2.0 WITH LLVM-exception": Apache-2.0 plus a grant that only widens
# what a redistributor may do. deny.toml allows the full expression.
[[PackageOverrides]]
name = "ar_archive_writer"
ecosystem = "crates.io"
license.override = ["Apache-2.0"]
reason = "Apache-2.0 WITH LLVM-exception: the exception only adds permissions; osv-scanner cannot express a WITH clause in its allow-list."
