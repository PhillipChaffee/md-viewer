# osv-scanner overrides for the root Cargo.lock. Every entry carries its
# reason and review date; the four that cargo-deny also ignores repeat the
# reasons recorded in deny.toml. The rest are "unmaintained" notices on
# crates this manifest does not choose: cargo-deny tolerates those when they
# are transitive, osv-scanner reports them all.

