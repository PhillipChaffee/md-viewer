name: Cross-platform check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same question ci.yml's `changes` job asks, for this workflow: on a
  # pull request that touches only documentation the check has nothing to
  # compile. A push to main runs it, and so does a failure here.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 2  # the merge commit and its parents
      - name: Changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/ci-changes.sh HEAD^1 HEAD >>"$GITHUB_OUTPUT"
          else
            scripts/ci-changes.sh >>"$GITHUB_OUTPUT"
          fi

  check:
    name: cargo check (${{ matrix.os }})
    needs: changes
    # The job always starts, and its steps carry the condition. A matrix
    # job skipped as a whole reports one check under the job's unexpanded
    # name, and the two names the branch rules require, one per system,
    # would never arrive.
    if: ${{ !cancelled() }}
    env:
      CODE_CHANGED: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        if: env.CODE_CHANGED == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.CODE_CHANGED == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.CODE_CHANGED == 'true'
      # --all-targets so test code compiles here too. Without it, a test
      # behind `#[cfg(target_os = "windows")]` is not merely unexecuted on
      # Windows — it is never compiled anywhere, which is how
      # `windows_drive_prefixes_are_not_treated_as_uri_schemes` (#154) ended up
      # guarding the one branch Linux cannot exercise while itself being
      # unchecked. Still `check`, not `test`: this job is a portability guard,
      # and running the suite on three platforms is a separate decision.
      - run: cargo check --locked --all-targets
        if: env.CODE_CHANGED == 'true'
      - name: Documentation only, nothing to compile
        if: env.CODE_CHANGED != 'true'
        run: echo "This change touches only documentation."
