# The `full-lint` job runs the full-lint Rust baseline
# (github.com/PhillipChaffee/full-lint) by reference, at the commit its
# `uses:` line pins; `./gates` runs the same gates locally. The other jobs
# are this repository's own: path filtering, site facts, the Kani proofs,
# the vendored renderer's lints and tests, and the workspace version sync.
permissions:
  contents: read  # least privilege: no step in this workflow writes to the repo (GitHub secure-use reference)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Which jobs this change needs. On a pull request it reads the paths the
  # merge commit changes against its first parent, the base branch; on a
  # push to main there is no such list and everything runs. A pull request
  # that touches only documentation skips the Rust jobs, and one that touches
  # nothing Kani compiles skips the proofs: they report as skipped, which a
  # required check accepts. scripts/ci-changes.sh holds the path rules. The
  # jobs below run unless the answer is the word `false`, so a failure here
  # runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # one shallow checkout and one git diff
    outputs:
      code: ${{ steps.paths.outputs.code }}
      proofs: ${{ steps.paths.outputs.proofs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 2  # the merge commit and its parents
      - name: Changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/ci-changes.sh HEAD^1 HEAD >>"$GITHUB_OUTPUT"
          else
            scripts/ci-changes.sh >>"$GITHUB_OUTPUT"
          fi

  # full-lint's Rust gates, run by full-lint's reusable workflow at the
  # pinned commit; ./gates reads the same pin, so a workstation runs the
  # same commands at the same commit. Upgrading is the SHA on both `uses:`
  # lines and `./gates sync` (GATES.md). The code gates (format, clippy,
  # rustdoc, tests, coverage, cognitive complexity, file length) follow the
  # path filter; the hygiene gates run on every change.
  full-lint-code:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-full-lint-code
      cancel-in-progress: true
    uses: PhillipChaffee/full-lint/.github/workflows/rust.yml@79e3c72edebff8f4f119bef780b7effebf80490b  # phillip/vibrant-volta-ykqzuy, not yet on main
    with:
      hygiene: false
      # Every code gate builds eframe, typst and merman, and the coverage
      # gate builds them a second time instrumented; the old test job alone
      # needed 40 minutes cold.
      code-timeout-minutes: 60
      # eframe links the GTK, xcb and fontconfig stacks, and dependency
      # build scripts probe them under clippy and rustdoc too. The last six
      # are for tests/e2e, which opens the real window on a virtual display,
      # presses keys on it, reads a screenshot and reads the window's icon
      # (xprop, from x11-utils); software GL draws it.
      apt-packages: >-
        clang pkg-config libxcb1-dev libxcb-render0-dev libxcb-shape0-dev
        libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev
        libfontconfig1-dev libdbus-1-dev
        xvfb xdotool imagemagick x11-utils libgl1-mesa-dri libxkbcommon-x11-0

  full-lint-hygiene:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-full-lint-hygiene
      cancel-in-progress: true
    uses: PhillipChaffee/full-lint/.github/workflows/rust.yml@79e3c72edebff8f4f119bef780b7effebf80490b  # phillip/vibrant-volta-ykqzuy, not yet on main
    with:
      code: false

  # The website's facts against the code. Each fact on docs/index.html and
  # docs/404.html carries a data-fact attribute, and the script reads the
  # same fact from the file that decides it. It runs on every change, so a
  # change to the code or to a page runs it.
  site-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Site facts (scripts/check-site-facts.sh)
        run: bash scripts/check-site-facts.sh

  # The machine-checked proofs in each module's proofs.rs (PROOFS.md lists
  # them). Kani compiles the whole crate with its own nightly toolchain and
  # hands every harness to the CBMC model checker. run-proofs.sh fails on a
  # harness that does not verify, on a cover check that is not reached, and
  # on a harness that was declared but did not run.
  #
  # The harnesses are spread over the matrix below: each runner takes one
  # share (PROOF_SHARD in run-proofs.sh says how the files are dealt out)
  # and holds its own share to the same three conditions. The number of
  # shares is the length of the matrix, read from strategy.job-total, so
  # the two cannot disagree and leave a share unrun. All shares restore one
  # cache: they compile the same crate graph.
  #
  # The job runs when the change touches something Kani compiles or the
  # proof machinery (scripts/ci-changes.sh has the list), and on every push
  # to main.
  proofs:
    name: proofs (share ${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.proofs != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a cold build of the dependency graph under Kani, then the harnesses
    strategy:
      fail-fast: false  # a failure in one share says nothing about the others
      matrix:
        shard: [1, 2, 3]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-proofs-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      PROOF_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # Dependency build scripts probe the same system libraries under Kani.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev libfontconfig1-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          key: kani-0.68.0
      # `cargo kani setup` downloads the release bundle (the pinned nightly
      # and CBMC) that matches the installed version.
      - name: Install Kani 0.68.0
        run: |
          cargo install --locked --version 0.68.0 kani-verifier
          cargo kani setup
      - name: Proofs (Kani 0.68.0, every harness and every cover check of this share)
        env:
          PROOF_LOG: ${{ runner.temp }}/proofs.log
        run: ./run-proofs.sh
      # Not a gate: what each harness took, for whoever next changes the
      # number of shares.
      - name: Harness results and times
        if: always()
        env:
          PROOF_LOG: ${{ runner.temp }}/proofs.log
        run: grep -E 'Checking harness|VERIFICATION|Verification Time|cover properties|^Complete' "$PROOF_LOG" || true

  # One check named `proofs` whatever the number of shares: green when
  # every share verified, or when the change touches nothing they cover
  # and they were skipped.
  proofs-result:
    name: proofs
    needs: proofs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every share verified, or none was needed
        env:
          RESULT: ${{ needs.proofs.result }}
        run: |
          echo "proofs: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]

  renderer:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RENDERER_FEATURES: better_syntax_highlighting,svg,svg_text,load-images,fetch,mermaid,math,macros
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev libfontconfig1-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/egui_commonmark -> target
            vendor/epaint -> target

      - name: Lint renderer crates
        run: |
          cargo clippy --manifest-path vendor/egui_commonmark/Cargo.toml -p egui_commonmark_extended --all-targets --features "$RENDERER_FEATURES"
          cargo clippy --manifest-path vendor/egui_commonmark/Cargo.toml -p egui_commonmark_backend_extended --all-targets --all-features
          cargo clippy --manifest-path vendor/egui_commonmark/Cargo.toml -p egui_commonmark_macros_extended --all-targets

      - name: Test renderer crates
        run: |
          cargo test --manifest-path vendor/egui_commonmark/Cargo.toml -p egui_commonmark_extended --features "$RENDERER_FEATURES"
          cargo test --manifest-path vendor/egui_commonmark/Cargo.toml -p egui_commonmark_backend_extended --no-default-features
          cargo test --manifest-path vendor/egui_commonmark/Cargo.toml -p egui_commonmark_backend_extended --all-features
          cargo test --manifest-path vendor/egui_commonmark/Cargo.toml -p egui_commonmark_macros_extended

      # The renderer's line breaking rests on the patched painter's row rule,
      # and these tests are what pins it.
      - name: Test the painter's text layout
        run: "cargo test --manifest-path vendor/epaint/Cargo.toml --lib text::"

  version-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check app/renderer workspace dependency contract
        run: bash scripts/check-workspace-sync.sh
